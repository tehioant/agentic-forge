[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-forge"
version = "0.1.0"
description = "Approval-gated local agent workshop"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
forge = "forge.__main__:main"

[tool.setuptools.packages.find]
include = ["forge*"]

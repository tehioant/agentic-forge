[tools]
python = "3.14.8"
gh = "2.102.0"
lefthook = { version = "2.1.16", postinstall = "lefthook install" }
shellcheck = "0.11.0"
"aqua:betterleaks/betterleaks" = "1.9.0"

[tasks.setup]
description = "Install Git hooks (also when tools were already cached)"
run = "lefthook install"

[tasks.test]
description = "Run the fresh factory public lifecycle tests"
env = { PYTHONDONTWRITEBYTECODE = "1" }
run = "python -m unittest discover -s factory_v1/tests -v"

[tools]
python = "3.14.8"
gh = "2.102.0"
lefthook = { version = "2.1.16", postinstall = "lefthook install" }
shellcheck = "0.11.0"
"aqua:betterleaks/betterleaks" = "1.9.0"

[tasks.setup]
description = "Install Git hooks (also when tools were already cached)"
run = "lefthook install"

[tasks.test]
description = "Run the factory unit and focused component tests with external execution blocked"
env = { PYTHONDONTWRITEBYTECODE = "1" }
run = "python scripts/run_factory_tests.py"
